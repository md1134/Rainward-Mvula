<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mvula chat demo</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#e5ddd5;display:flex;flex-direction:column;height:100vh}
header{background:#075e54;color:#fff;padding:12px 16px;font-weight:600}
header a{color:#cfe;font-weight:400;font-size:13px;margin-left:10px}
#log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:8px 10px;border-radius:8px;white-space:pre-wrap;font-size:15px;line-height:1.35}
.me{align-self:flex-end;background:#dcf8c6}.bot{align-self:flex-start;background:#fff}
form{display:flex;gap:8px;padding:8px;background:#f0f0f0}
input{flex:1;padding:10px;border:1px solid #ccc;border-radius:20px;font-size:16px}
button{background:#075e54;color:#fff;border:0;border-radius:20px;padding:0 18px;font-size:15px}
</style></head><body>
<header>Mvula (demo) <a href="/">Live map</a></header>
<div id="log"></div>
<form id="f"><input id="t" autocomplete="off" placeholder="Type a message, e.g. HI"><button>Send</button></form>
<script>
let phone; try{phone=localStorage.getItem('mvula_phone');if(!phone){phone=String(Math.random()).slice(2,10);localStorage.setItem('mvula_phone',phone)}}catch(e){phone=String(Math.random()).slice(2,10)}
const log=document.getElementById('log'),t=document.getElementById('t');
function add(txt,c){const d=document.createElement('div');d.className='m '+c;d.textContent=txt;log.appendChild(d);log.scrollTop=log.scrollHeight}
async function send(txt){add(txt,'me');const r=await fetch('/demo/message/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,text:txt})});add((await r.json()).reply,'bot')}
document.getElementById('f').onsubmit=e=>{e.preventDefault();if(t.value.trim()){send(t.value.trim());t.value=''}};
send('hi');
</script></body></html>
